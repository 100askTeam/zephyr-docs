<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
  <defs>
    <marker id="boot-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 5 L0 10 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10263a" flood-opacity=".18"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .boot-line { fill:none; stroke:#d97706; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#boot-arrow); }
      .run-bus { fill:none; stroke:#3479a8; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .future-bus { fill:none; stroke:#7b8794; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:10 9; }
      .boot-flow { fill:none; stroke:#fff0b0; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:5 18; opacity:0; animation:boot-march .8s linear infinite, boot-stage 4.8s ease-in-out infinite; }
      .boot-flow.stage-2 { animation-delay:0s, 1.2s; }
      .boot-flow.stage-3 { animation-delay:0s, 2.4s; }
      .boot-flow.stage-4 { animation-delay:0s, 3.6s; }
      .run-flow { fill:none; stroke:#b8e6ff; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:8 18; opacity:.72; animation:run-activity 2.4s ease-in-out infinite alternate; }
      .future-flow { fill:none; stroke:#c2ccd5; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 20; opacity:.2; animation:future-pulse 3.2s ease-in-out infinite; }
      .badge { fill:#d97706; stroke:#ffffff; stroke-width:3; }
      .badge-text { fill:#ffffff; font-size:18px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
      @keyframes boot-march { from { stroke-dashoffset:22; } to { stroke-dashoffset:0; } }
      @keyframes boot-stage {
        0%, 100% { opacity:0; }
        4%, 20% { opacity:1; }
        25% { opacity:0; }
      }
      @keyframes run-activity {
        from { stroke-dashoffset:26; opacity:.42; }
        to { stroke-dashoffset:-26; opacity:.82; }
      }
      @keyframes future-pulse {
        0%, 100% { opacity:.16; }
        50% { opacity:.58; }
      }
    </style>
  </defs>

  <rect width="1500" height="1020" fill="#f7f9fb"/>
  <text x="750" y="54" text-anchor="middle" font-size="36" font-weight="700" fill="#14263d">HPM6E70 上电后，代码和数据在哪里流动</text>
  <text x="750" y="89" text-anchor="middle" font-size="19" fill="#5c6b7a">橙色箭头表示启动先后顺序；蓝色实线表示运行时连接；灰色虚线表示后续启用的 SDRAM 路径</text>

  <rect x="35" y="120" width="1430" height="650" rx="36" fill="#f2f7f3" stroke="#73927d" stroke-width="3"/>
  <text x="72" y="162" font-size="22" font-weight="700" fill="#41634c">DshanMCU-HPM6E70 开发板</text>
  <circle cx="74" cy="731" r="14" fill="#f7f9fb" stroke="#73927d" stroke-width="3"/>
  <circle cx="1426" cy="731" r="14" fill="#f7f9fb" stroke="#73927d" stroke-width="3"/>

  <rect x="430" y="155" width="650" height="570" rx="28" fill="#17324d" stroke="#0d2237" stroke-width="4" filter="url(#shadow)"/>
  <text x="755" y="203" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">HPM6E70 芯片内部</text>
  <text x="755" y="233" text-anchor="middle" font-size="18" fill="#bdd0e0">深蓝色框内的资源集成在芯片中</text>

  <!-- 启动路径：仅表示有先后顺序的动作 -->
  <path class="boot-line" d="M270 210 H390 V305 H480"/>
  <path class="boot-line" d="M600 360 V435"/>
  <path class="boot-line" d="M370 500 H480"/>
  <path class="boot-line" d="M710 500 H755 V305 H790"/>

  <!-- 橙色高亮按 1→4 依次出现，强化启动先后顺序 -->
  <path class="boot-flow stage-1" d="M270 210 H390 V305 H480"/>
  <path class="boot-flow stage-2" d="M600 360 V435"/>
  <path class="boot-flow stage-3" d="M370 500 H480"/>
  <path class="boot-flow stage-4" d="M710 500 H755 V305 H790"/>

  <!-- 运行时连接：无箭头，避免误解为单向数据流 -->
  <path class="run-bus" d="M1020 305 H1048 V650 H1020"/>
  <path class="run-bus" d="M1020 500 H1048"/>
  <path class="run-bus" d="M1020 650 H1150"/>

  <!-- 蓝色高亮往返移动，只表示运行时持续读写，不表示固定单向顺序 -->
  <path class="run-flow" d="M1020 305 H1048 V650 H1020"/>
  <path class="run-flow" d="M1020 500 H1048"/>
  <path class="run-flow" d="M1020 650 H1150"/>

  <!-- 后续 SDRAM/FEMC 连接 -->
  <path class="future-bus" d="M1150 390 H1110 V690 H1020"/>
  <path class="future-flow" d="M1150 390 H1110 V690 H1020"/>

  <!-- 板载 NOR Flash -->
  <g>
    <rect x="70" y="390" width="300" height="220" rx="18" fill="#2d3138" stroke="#14171b" stroke-width="3"/>
    <g stroke="#a7adb4" stroke-width="8">
      <path d="M94 375 V390 M141 375 V390 M188 375 V390 M235 375 V390 M282 375 V390 M329 375 V390"/>
      <path d="M94 610 V625 M141 610 V625 M188 610 V625 M235 610 V625 M282 610 V625 M329 610 V625"/>
    </g>
    <text x="220" y="441" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">板载 NOR Flash</text>
    <text x="220" y="481" text-anchor="middle" font-size="20" fill="#d9e0e6">U5 · MX25L12833F</text>
    <text x="220" y="516" text-anchor="middle" font-size="20" fill="#d9e0e6">16 MiB · 断电后保留</text>
    <rect x="112" y="545" width="216" height="42" rx="8" fill="#171a1e"/>
    <text x="220" y="573" text-anchor="middle" font-size="18" fill="#ffcf76">启动头 + Zephyr 固件</text>
  </g>

  <!-- 上电与复位 -->
  <g>
    <rect x="70" y="180" width="200" height="60" rx="30" fill="#fff0d9" stroke="#d97706" stroke-width="2"/>
    <text x="170" y="218" text-anchor="middle" font-size="21" font-weight="700" fill="#8c4d00">上电 / 复位</text>
  </g>

  <!-- 芯片内部资源 -->
  <g>
    <rect x="490" y="250" width="220" height="110" rx="14" fill="#fff5dd" stroke="#d69a2d" stroke-width="3"/>
    <text x="600" y="293" text-anchor="middle" font-size="24" font-weight="700" fill="#7b4a00">BootROM</text>
    <text x="600" y="327" text-anchor="middle" font-size="18" fill="#725b35">128 KB · 复位后首先执行</text>

    <rect x="800" y="250" width="220" height="110" rx="14" fill="#eaf2ff" stroke="#5481bd" stroke-width="3"/>
    <text x="910" y="293" text-anchor="middle" font-size="24" font-weight="700" fill="#244f87">CPU0 / CPU1</text>
    <text x="910" y="327" text-anchor="middle" font-size="18" fill="#4e6580">取指并运行 Zephyr</text>

    <rect x="490" y="445" width="220" height="110" rx="14" fill="#e7f6ed" stroke="#489066" stroke-width="3"/>
    <text x="600" y="488" text-anchor="middle" font-size="24" font-weight="700" fill="#23603b">XPI0 控制器</text>
    <text x="600" y="522" text-anchor="middle" font-size="18" fill="#456b54">访问板载串行 Flash</text>

    <rect x="800" y="445" width="220" height="110" rx="14" fill="#f0ebff" stroke="#7b68b2" stroke-width="3"/>
    <text x="910" y="488" text-anchor="middle" font-size="24" font-weight="700" fill="#4c3981">片内 SRAM</text>
    <text x="910" y="522" text-anchor="middle" font-size="18" fill="#625a7e">栈、.data、.bss、内核对象</text>

    <rect x="490" y="610" width="530" height="80" rx="14" fill="#e8f3f5" stroke="#4d8792" stroke-width="3"/>
    <text x="755" y="642" text-anchor="middle" font-size="22" font-weight="700" fill="#245763">片内外设控制器</text>
    <text x="755" y="673" text-anchor="middle" font-size="17" fill="#476f77">时钟 · 中断控制器 · 定时器 · UART0 · GPIO · FEMC</text>
  </g>

  <!-- 板载 SDRAM -->
  <g>
    <rect x="1150" y="250" width="250" height="175" rx="18" fill="#f1f2f4" stroke="#7a8794" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1275" y="298" text-anchor="middle" font-size="25" font-weight="700" fill="#4c5966">板载 SDRAM</text>
    <text x="1275" y="338" text-anchor="middle" font-size="19" fill="#687582">U9 · 32 MiB</text>
    <text x="1275" y="372" text-anchor="middle" font-size="19" fill="#687582">经 FEMC 连接</text>
    <text x="1275" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#8b5b21">第 11～13 课启用</text>
  </g>

  <!-- 板级连接 -->
  <g>
    <rect x="1150" y="575" width="250" height="150" rx="18" fill="#ffffff" stroke="#4d8792" stroke-width="3"/>
    <text x="1275" y="621" text-anchor="middle" font-size="24" font-weight="700" fill="#245763">板级连接</text>
    <text x="1275" y="661" text-anchor="middle" font-size="19" fill="#476f77">UART0 → 串口日志</text>
    <text x="1275" y="695" text-anchor="middle" font-size="19" fill="#476f77">GPIO PC22 → 绿色 LED</text>
  </g>

  <!-- 启动步骤编号，编号与线分离，不遮挡路径 -->
  <g>
    <circle class="badge" cx="420" cy="268" r="17"/><text class="badge-text" x="420" y="269">1</text>
    <circle class="badge" cx="630" cy="403" r="17"/><text class="badge-text" x="630" y="404">2</text>
    <circle class="badge" cx="430" cy="475" r="17"/><text class="badge-text" x="430" y="476">3</text>
    <circle class="badge" cx="727" cy="405" r="17"/><text class="badge-text" x="727" y="406">4</text>
  </g>

  <!-- 图例 -->
  <rect x="70" y="795" width="1360" height="120" rx="18" fill="#ffffff" stroke="#c8d3dc" stroke-width="2"/>
  <g font-size="18" fill="#293b50">
    <circle class="badge" cx="105" cy="830" r="15"/><text class="badge-text" x="105" y="831" font-size="16">1</text>
    <text x="132" y="837">复位进入 BootROM</text>
    <circle class="badge" cx="390" cy="830" r="15"/><text class="badge-text" x="390" y="831" font-size="16">2</text>
    <text x="417" y="837">BootROM 配置 XPI0</text>
    <circle class="badge" cx="690" cy="830" r="15"/><text class="badge-text" x="690" y="831" font-size="16">3</text>
    <text x="717" y="837">XPI0 读取 NOR Flash</text>
    <circle class="badge" cx="1005" cy="830" r="15"/><text class="badge-text" x="1005" y="831" font-size="16">4</text>
    <text x="1032" y="837">CPU 从 XPI 映射区取指</text>

    <path class="run-bus" d="M95 875 H155"/>
    <text x="172" y="882">运行时读写连接（无固定先后顺序）</text>
    <path class="future-bus" d="M705 875 H765"/>
    <text x="782" y="882">后续启用的 SDRAM / FEMC 路径</text>
  </g>

  <rect x="180" y="935" width="1140" height="58" rx="16" fill="#ffffff" stroke="#c8d3dc" stroke-width="2"/>
  <text x="750" y="961" text-anchor="middle" font-size="19" font-weight="700" fill="#24364b">Devicetree 与 Kconfig 在构建时确定地址、引脚和启用状态</text>
  <text x="750" y="983" text-anchor="middle" font-size="16" fill="#5c6b7a">它们是生成固件的配置输入，不是芯片内部的物理电路</text>
</svg>
