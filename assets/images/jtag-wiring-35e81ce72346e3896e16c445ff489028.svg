<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="642" viewBox="0 0 1120 642" role="img" aria-labelledby="title desc">
  <title id="title">USBToolBox 调试器 J1 与 HPM6E70 板卡 J5 的五线 JTAG 接线图</title>
  <desc id="desc">调试器 J1 的 J1-14(TCK/IO4)、J1-13(TMS/IO7)、J1-18(TDI/IO6)、J1-16(TDO/IO5)、J1-19/20(GND) 分别对应连接 HPM6E70 核心板 J5 的 J5-5(SWCLK/TCK)、J5-6(SWDIO/TMS)、J5-3(TDI)、J5-4(TDO)、J5-7(GND)。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <filter id="pill-shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2942" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clip-left">
      <rect x="44" y="124" width="366" height="428" rx="14"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="710" y="124" width="366" height="428" rx="14"/>
    </clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 1px; }
      .title { font: 700 24px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-l { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-r { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .micro { font: 600 12px "JetBrains Mono", Consolas, monospace; fill: #64748b; }
      .card-title { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .pin { font: 700 13px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .sig { font: 700 15px "JetBrains Mono", Inter, "Microsoft YaHei", monospace; fill: #0f2942; }
      .alias { font: 500 13px "JetBrains Mono", "Microsoft YaHei", monospace; fill: #64748b; }
      .role { font: 500 12.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .wire-lbl { font: 700 13px "JetBrains Mono", Consolas, monospace; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- Canvas & blueprint grid -->
  <rect width="1120" height="642" fill="url(#bg-grad)"/>
  <rect width="1120" height="642" fill="url(#bp-grid)"/>

  <!-- Top Header -->
  <g>
    <rect x="44" y="24" width="194" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="70" y="40" class="eyebrow">5-WIRE JTAG · 3.3V</text>
    <text x="44" y="76" class="title">JTAG 接线对应关系</text>
    <text x="44" y="99" class="subtitle">先将调试器 J1 的复用引脚按信号名转换，再与板卡 J5 同名信号一一连接</text>
    <text x="1076" y="76" text-anchor="end" class="micro">NO SRST · NO TRST</text>
  </g>

  <!-- Left Hardware Module Card: USBToolBox J1 -->
  <g filter="url(#card-shadow)">
    <rect x="44" y="124" width="366" height="428" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-left)">
    <rect x="44" y="124" width="366" height="4" fill="#1769aa"/>
  </g>
  <rect x="64" y="142" width="66" height="22" rx="11" fill="#e0f2fe"/>
  <text x="97" y="157" text-anchor="middle" class="badge-l">调试器端</text>
  <text x="390" y="157" text-anchor="end" class="micro">J1 · 2×10 PIN</text>
  <text x="64" y="187" class="card-title">DshanPI USBToolBox</text>
  <line x1="64" y1="202" x2="390" y2="202" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Pin Rows (y centers: 240, 302, 364, 426, 488) -->
  <g>
    <rect x="62" y="218" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="227" width="84" height="26" rx="6" fill="#e0f2fe"/>
    <text x="112" y="245" text-anchor="middle" class="pin">J1-14</text>
    <text x="168" y="245" class="sig">TCK</text>
    <text x="378" y="244" text-anchor="end" class="alias">SWCLK · IO4</text>

    <rect x="62" y="280" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="289" width="84" height="26" rx="6" fill="#ccfbf1"/>
    <text x="112" y="307" text-anchor="middle" class="pin">J1-13</text>
    <text x="168" y="307" class="sig">TMS</text>
    <text x="378" y="306" text-anchor="end" class="alias">SWDIO · IO7</text>

    <rect x="62" y="342" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="351" width="84" height="26" rx="6" fill="#e0e7ff"/>
    <text x="112" y="369" text-anchor="middle" class="pin">J1-18</text>
    <text x="168" y="369" class="sig">TDI</text>
    <text x="378" y="368" text-anchor="end" class="alias">IO6</text>

    <rect x="62" y="404" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="413" width="84" height="26" rx="6" fill="#fef3c7"/>
    <text x="112" y="431" text-anchor="middle" class="pin">J1-16</text>
    <text x="168" y="431" class="sig">TDO</text>
    <text x="378" y="430" text-anchor="end" class="alias">IO5</text>

    <rect x="62" y="466" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="475" width="84" height="26" rx="6" fill="#e2e8f0"/>
    <text x="112" y="493" text-anchor="middle" class="pin">J1-19/20</text>
    <text x="168" y="493" class="sig">GND</text>
    <text x="378" y="492" text-anchor="end" class="role">共地参考</text>
  </g>

  <!-- Right Hardware Module Card: HPM6E70 J5 -->
  <g filter="url(#card-shadow)">
    <rect x="710" y="124" width="366" height="428" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-right)">
    <rect x="710" y="124" width="366" height="4" fill="#0d9488"/>
  </g>
  <rect x="730" y="142" width="66" height="22" rx="11" fill="#ccfbf1"/>
  <text x="763" y="157" text-anchor="middle" class="badge-r">目标板端</text>
  <text x="1056" y="157" text-anchor="end" class="micro">J5 · 7 PIN</text>
  <text x="730" y="187" class="card-title">HPM6E70 核心板</text>
  <line x1="730" y1="202" x2="1056" y2="202" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right Pin Rows -->
  <g>
    <rect x="730" y="218" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="738" y="227" width="58" height="26" rx="6" fill="#e0f2fe"/>
    <text x="767" y="245" text-anchor="middle" class="pin">J5-5</text>
    <text x="808" y="245" class="sig">SWCLK / TCK</text>
    <text x="1046" y="244" text-anchor="end" class="role">时钟</text>

    <rect x="730" y="280" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="738" y="289" width="58" height="26" rx="6" fill="#ccfbf1"/>
    <text x="767" y="307" text-anchor="middle" class="pin">J5-6</text>
    <text x="808" y="307" class="sig">SWDIO / TMS</text>
    <text x="1046" y="306" text-anchor="end" class="role">模式</text>

    <rect x="730" y="342" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="738" y="351" width="58" height="26" rx="6" fill="#e0e7ff"/>
    <text x="767" y="369" text-anchor="middle" class="pin">J5-3</text>
    <text x="808" y="369" class="sig">TDI</text>
    <text x="1046" y="368" text-anchor="end" class="role">芯片输入</text>

    <rect x="730" y="404" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="738" y="413" width="58" height="26" rx="6" fill="#fef3c7"/>
    <text x="767" y="431" text-anchor="middle" class="pin">J5-4</text>
    <text x="808" y="431" class="sig">TDO</text>
    <text x="1046" y="430" text-anchor="end" class="role">芯片输出</text>

    <rect x="730" y="466" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="738" y="475" width="58" height="26" rx="6" fill="#e2e8f0"/>
    <text x="767" y="493" text-anchor="middle" class="pin">J5-7</text>
    <text x="808" y="493" class="sig">GND</text>
    <text x="1046" y="492" text-anchor="end" class="role">共地参考</text>
  </g>

  <!-- Signal Traces & Directional Arrows + Center Badges -->
  <!-- 1. TCK (Left -> Right, #0284c7) -->
  <g>
    <line x1="416" y1="240" x2="695" y2="240" stroke="#0284c7" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="702,240 691,234.5 691,245.5" fill="#0284c7"/>
    <circle cx="410" cy="240" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="410" cy="240" r="2" fill="#0284c7"/>
    <circle cx="710" cy="240" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="710" cy="240" r="2" fill="#0284c7"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="225" width="108" height="30" rx="15" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    </g>
    <circle cx="524" cy="240" r="3.5" fill="#0284c7"/>
    <text x="566" y="244.5" text-anchor="middle" class="wire-lbl" fill="#0369a1">TCK →</text>
  </g>

  <!-- 2. TMS (Left -> Right, #0d9488) -->
  <g>
    <line x1="416" y1="302" x2="695" y2="302" stroke="#0d9488" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="702,302 691,296.5 691,307.5" fill="#0d9488"/>
    <circle cx="410" cy="302" r="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="410" cy="302" r="2" fill="#0d9488"/>
    <circle cx="710" cy="302" r="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="710" cy="302" r="2" fill="#0d9488"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="287" width="108" height="30" rx="15" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    </g>
    <circle cx="524" cy="302" r="3.5" fill="#0d9488"/>
    <text x="566" y="306.5" text-anchor="middle" class="wire-lbl" fill="#0f766e">TMS →</text>
  </g>

  <!-- 3. TDI (Left -> Right, #4f46e5) -->
  <g>
    <line x1="416" y1="364" x2="695" y2="364" stroke="#4f46e5" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="702,364 691,358.5 691,369.5" fill="#4f46e5"/>
    <circle cx="410" cy="364" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <circle cx="410" cy="364" r="2" fill="#4f46e5"/>
    <circle cx="710" cy="364" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <circle cx="710" cy="364" r="2" fill="#4f46e5"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="349" width="108" height="30" rx="15" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
    </g>
    <circle cx="524" cy="364" r="3.5" fill="#4f46e5"/>
    <text x="566" y="368.5" text-anchor="middle" class="wire-lbl" fill="#4338ca">TDI →</text>
  </g>

  <!-- 4. TDO (Right -> Left, #d97706) -->
  <g>
    <line x1="425" y1="426" x2="704" y2="426" stroke="#d97706" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="418,426 429,420.5 429,431.5" fill="#d97706"/>
    <circle cx="410" cy="426" r="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="410" cy="426" r="2" fill="#d97706"/>
    <circle cx="710" cy="426" r="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="710" cy="426" r="2" fill="#d97706"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="411" width="108" height="30" rx="15" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    </g>
    <text x="554" y="430.5" text-anchor="middle" class="wire-lbl" fill="#b45309">← TDO</text>
    <circle cx="596" cy="426" r="3.5" fill="#d97706"/>
  </g>

  <!-- 5. GND (Common Ground, #475569) -->
  <g>
    <line x1="416" y1="488" x2="704" y2="488" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <circle cx="410" cy="488" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <circle cx="410" cy="488" r="2" fill="#475569"/>
    <circle cx="710" cy="488" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <circle cx="710" cy="488" r="2" fill="#475569"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="473" width="108" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <circle cx="526" cy="488" r="3.5" fill="#475569"/>
    <text x="566" y="492.5" text-anchor="middle" class="wire-lbl" fill="#334155">GND</text>
  </g>

  <!-- Bottom Technical Note Bar -->
  <g>
    <rect x="44" y="574" width="1032" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="584" width="50" height="24" rx="6" fill="#e0f2fe"/>
    <text x="83" y="600.5" text-anchor="middle" class="note-tag">注意</text>
    <text x="122" y="601" class="note-txt">IO4～IO7 为调试器排针丝印别名，接线以信号名为准；无需连接 SRST，切勿并接两端的 3.3 V / 5 V 电源。</text>
  </g>
</svg>
