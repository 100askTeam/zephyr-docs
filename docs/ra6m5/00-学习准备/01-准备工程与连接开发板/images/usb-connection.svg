<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-labelledby="title desc">
  <title id="title">一根 USB 线连接开发板</title>
  <desc id="desc">电脑通过UART和DAP复合USB接口连接板载调试器，串口路径用于观察输出，SWD路径用于烧录和调试，USB同时供电。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#386b9b"/></marker></defs>
  <rect width="940" height="330" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#183247">
    <rect x="30" y="99" width="190" height="140" rx="5" fill="#f4f6f8" stroke="#536b80" stroke-width="2"/>
    <text x="125" y="145" text-anchor="middle" font-size="23" font-weight="bold">电脑</text>
    <text x="125" y="184" text-anchor="middle" font-size="18">VS Code / PowerShell</text>
    <text x="125" y="211" text-anchor="middle" font-size="17">串口、烧录、断点调试</text>
    <rect x="400" y="34" width="510" height="265" rx="6" fill="#fff" stroke="#536b80" stroke-width="2"/>
    <text x="423" y="68" font-size="22" font-weight="bold">DShanMCU RA6M5</text>
    <rect x="423" y="112" width="178" height="127" fill="#eef4fa" stroke="#386b9b"/>
    <text x="512" y="147" text-anchor="middle" font-size="21">板载调试器</text>
    <text x="512" y="176" text-anchor="middle" font-size="18">CH547F</text>
    <text x="512" y="208" text-anchor="middle" font-size="17">UART + CMSIS-DAP</text>
    <rect x="760" y="112" width="124" height="127" fill="#f4f6f8" stroke="#536b80"/>
    <text x="822" y="173" text-anchor="middle" font-size="22" font-weight="bold">RA6M5</text>
    <text x="822" y="204" text-anchor="middle" font-size="17">执行程序</text>
    <path d="M229 176H413" stroke="#386b9b" stroke-width="4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="316" y="121" text-anchor="middle" font-size="19">一根 USB 数据线</text>
    <text x="316" y="148" text-anchor="middle" font-size="17">接 UART&amp;DAP</text>
    <text x="316" y="216" text-anchor="middle" font-size="17">同时供电</text>
    <path d="M612 145H748M612 209H748" stroke="#386b9b" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="680" y="128" text-anchor="middle" font-size="17">串口：运行输出</text>
    <text x="680" y="193" text-anchor="middle" font-size="17">SWD：烧录 / 调试</text>
    <text x="424" y="274" font-size="17">BootMode 置 OFF，使用 RES 按键复位程序。</text>
  </g>
</svg>
