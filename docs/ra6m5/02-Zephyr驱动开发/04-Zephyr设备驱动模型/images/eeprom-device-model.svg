<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="674" viewBox="0 0 1040 674" role="img" aria-labelledby="title desc">
  <title id="title">AT24C02 设备对象与配置、数据、操作表和初始化的关系</title>
  <desc id="desc">DEVICE_DT_GET 引用构建时定义的 AT24C02 设备对象。config 指向只读配置，data 指向运行数据，api 指向 EEPROM 操作表，ops.init 指向初始化函数，state 指向初始化状态。箭头表示指针引用而不是函数执行顺序。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 4 0 8Z" fill="#51565c"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24282d; }
      .box { fill: #fff; stroke: #626971; stroke-width: 1.4; }
      .wire { fill: none; stroke: #51565c; stroke-width: 1.6; marker-end: url(#arrow); }
      .rule { fill: none; stroke: #bdc2c7; stroke-width: 1; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .body { font-size: 18px; }
      .small { font-size: 17px; fill: #555d65; }
      .code { font-family: Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1040" height="674" fill="#fff"/>
  <text x="30" y="40" class="heading">AT24C02 的设备对象</text>
  <text x="1010" y="40" text-anchor="end" class="small">箭头表示引用关系</text>
  <path d="M30 58H1010" class="rule"/>
  <text x="30" y="94" class="body code">DEVICE_DT_GET(DT_ALIAS(eeprom0))</text>
  <path d="M176 106V143" class="wire"/>
  <text x="198" y="132" class="small">取得对象地址</text>
  <rect x="30" y="143" width="298" height="430" class="box"/>
  <text x="179" y="177" text-anchor="middle" class="label code">struct device</text>
  <path d="M30 195H328M30 268H328M30 341H328M30 421H328M30 494H328" class="rule"/>
  <text x="55" y="237" class="label code">config</text>
  <text x="55" y="310" class="label code">data</text>
  <text x="55" y="386" class="label code">api</text>
  <text x="55" y="463" class="label code">ops.init</text>
  <text x="55" y="539" class="label code">state</text>
  <path d="M328 231H479" class="wire"/>
  <path d="M328 304H479" class="wire"/>
  <path d="M328 381H479" class="wire"/>
  <path d="M328 458H479" class="wire"/>
  <path d="M328 534H479" class="wire"/>
  <rect x="479" y="194" width="531" height="74" class="box"/>
  <text x="499" y="221" class="label">只读配置 · eeprom_at2x_config</text>
  <text x="499" y="248" class="small">容量、页大小、地址宽度、I2C 设备及地址</text>
  <rect x="479" y="277" width="531" height="57" class="box"/>
  <text x="499" y="301" class="label">运行数据 · eeprom_at2x_data</text>
  <text x="499" y="324" class="small">lock：当前设备的访问互斥锁</text>
  <rect x="479" y="344" width="531" height="76" class="box"/>
  <text x="499" y="370" class="label">EEPROM 操作表 · eeprom_at2x_api</text>
  <text x="499" y="397" class="body code">read → eeprom_at2x_read</text>
  <rect x="479" y="430" width="531" height="57" class="box"/>
  <text x="499" y="454" class="label">初始化函数 · eeprom_at2x_init</text>
  <text x="499" y="477" class="small">启动时初始化锁、检查父总线</text>
  <rect x="479" y="497" width="531" height="76" class="box"/>
  <text x="499" y="523" class="label">设备状态 · device_state</text>
  <text x="499" y="550" class="small">记录初始化是否执行，以及初始化结果</text>
  <path d="M30 599H1010" class="rule"/>
  <text x="30" y="628" class="body">DEVICE_DT_DEFINE() 在构建时关联这些对象，并生成启动时使用的初始化条目。</text>
  <text x="30" y="655" class="small">应用读取时使用 api；系统启动时调用 ops.init；device_is_ready() 检查 state。</text>
</svg>
