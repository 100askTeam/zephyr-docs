<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">低电平有效的 D12 每隔 500 毫秒翻转一次</title>
  <desc id="desc">输出配置先让 P400 为高电平，LED 熄灭。第一次进入循环时翻转为低电平，点亮 LED；500 毫秒后翻转为高电平，熄灭 LED；1000 毫秒后再次点亮。完整亮灭周期约为一秒。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#41596c" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="480" rx="12" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#17384d">
    <text x="32" y="43" font-size="25" font-weight="700">D12：低电平点亮，每隔 500 ms 翻转</text>
    <text x="32" y="76" font-size="18" fill="#526b7c">Board：P400 / GPIO_ACTIVE_LOW　　应用：toggle → sleep → toggle</text>
    <text x="32" y="147" font-size="19">P400 高电平</text>
    <text x="32" y="223" font-size="19">P400 低电平</text>
    <g stroke="#cddbe4" stroke-width="1" stroke-dasharray="4 5">
      <path d="M242 110 V354"/><path d="M402 110 V354"/><path d="M562 110 V354"/><path d="M722 110 V354"/><path d="M882 110 V354"/>
      <path d="M192 140 H905"/><path d="M192 216 H905"/>
    </g>
    <path d="M192 140 H242 V216 H402 V140 H562 V216 H722 V140 H882 V216 H910" fill="none" stroke="#1769aa" stroke-width="4"/>
    <text x="242" y="106" font-size="17" text-anchor="middle">第一次翻转</text>
    <text x="32" y="291" font-size="19">D12 状态</text>
    <g stroke="#abc1ce" stroke-width="1">
      <rect x="192" y="265" width="50" height="38" fill="#ecf1f4"/>
      <rect x="242" y="265" width="160" height="38" fill="#d8ecdc"/>
      <rect x="402" y="265" width="160" height="38" fill="#ecf1f4"/>
      <rect x="562" y="265" width="160" height="38" fill="#d8ecdc"/>
      <rect x="722" y="265" width="160" height="38" fill="#ecf1f4"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="217" y="291">灭</text><text x="322" y="291">亮</text><text x="482" y="291">灭</text><text x="642" y="291">亮</text><text x="802" y="291">灭</text>
    </g>
    <path d="M192 325 H917" fill="none" stroke="#41596c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g font-size="18" text-anchor="middle">
      <text x="242" y="351">0</text><text x="402" y="351">500</text><text x="562" y="351">1000</text><text x="722" y="351">1500</text><text x="882" y="351">2000</text>
    </g>
    <text x="32" y="351" font-size="18">名义时间 / ms</text>
    <path d="M242 370 V384 H562 V370" fill="none" stroke="#3e7951" stroke-width="2"/>
    <text x="402" y="412" font-size="20" font-weight="700" fill="#356945" text-anchor="middle">一个亮灭周期 ≈ 1 s</text>
    <text x="32" y="458" font-size="17" fill="#526b7c">初始配置为无效状态（高电平、熄灭）；k_sleep 的实际恢复时刻还受调度影响。</text>
  </g>
</svg>
