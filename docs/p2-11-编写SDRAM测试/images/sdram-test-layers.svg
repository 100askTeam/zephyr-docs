<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586b82"/>
    </marker>
    <style>
      .title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#172b4d}
      .head{font:700 22px 'Microsoft YaHei',sans-serif;fill:#172b4d}
      .body{font:17px 'Microsoft YaHei',sans-serif;fill:#344563}
      .note{font:700 18px 'Microsoft YaHei',sans-serif;fill:#8a3b12}
      .arrow{stroke:#586b82;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="520" rx="28" fill="#f4f7fb"/>
  <text x="640" y="58" text-anchor="middle" class="title">一次“通过”只证明一层，五层都通过才覆盖 32 MiB</text>

  <rect x="45" y="120" width="210" height="220" rx="20" fill="#eef3ff" stroke="#5275d8" stroke-width="3"/>
  <text x="150" y="168" text-anchor="middle" class="head">启动状态</text>
  <text x="150" y="210" text-anchor="middle" class="body">FEMC 配置返回 0</text>
  <text x="150" y="244" text-anchor="middle" class="body">时钟与地址范围</text>
  <text x="150" y="294" text-anchor="middle" class="note">还没证明存储可靠</text>

  <path d="M270 230 H315" class="arrow"/>
  <rect x="330" y="120" width="210" height="220" rx="20" fill="#eefaf2" stroke="#48a362" stroke-width="3"/>
  <text x="435" y="168" text-anchor="middle" class="head">快速与数据线</text>
  <text x="435" y="210" text-anchor="middle" class="body">四组互补数据</text>
  <text x="435" y="244" text-anchor="middle" class="body">walking 1 / 0</text>
  <text x="435" y="294" text-anchor="middle" class="note">检查基本 DQ 通路</text>

  <path d="M555 230 H600" class="arrow"/>
  <rect x="615" y="120" width="210" height="220" rx="20" fill="#fff8e8" stroke="#d39a2c" stroke-width="3"/>
  <text x="720" y="168" text-anchor="middle" class="head">字节通道</text>
  <text x="720" y="210" text-anchor="middle" class="body">8 位读写 1 KiB</text>
  <text x="720" y="244" text-anchor="middle" class="body">触发 DM0 / DM1</text>
  <text x="720" y="294" text-anchor="middle" class="note">检查两个字节通道</text>

  <path d="M840 230 H885" class="arrow"/>
  <rect x="900" y="120" width="330" height="220" rx="20" fill="#f7efff" stroke="#8461c9" stroke-width="3"/>
  <text x="1065" y="168" text-anchor="middle" class="head">全容量与地址线</text>
  <text x="1065" y="210" text-anchor="middle" class="body">4 种模式覆盖全部 32 MiB</text>
  <text x="1065" y="244" text-anchor="middle" class="body">每个地址保存不同数据</text>
  <text x="1065" y="294" text-anchor="middle" class="note">检查刷新、容量与地址镜像</text>

  <rect x="165" y="395" width="950" height="78" rx="18" fill="#203858"/>
  <text x="640" y="430" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#ffffff">每层失败都打印阶段、地址、期望值和读回值</text>
  <text x="640" y="458" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#d8e4f2">串口最后出现 SDRAM TEST PASSED: 32 MiB verified，才完成整颗 U9 的验证</text>
</svg>
