<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Zephyr 应用、设备树、Binding 和驱动的关系</title>
  <desc id="desc">构建阶段，应用代码与配置、设备树节点、驱动源码和 Binding 汇入 Zephyr 构建系统并生成固件。运行阶段，应用通过驱动 API 调用设备驱动，设备驱动操作硬件设备。</desc>
  <defs>
    <linearGradient id="build-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <style>
      .stage { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .stage-note { font: 17px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .card-title { font: 700 19px Arial, "Microsoft YaHei", sans-serif; fill: #172033; }
      .card-note { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .build-title { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .build-note { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .flow-label { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Arial, sans-serif; letter-spacing: 0.4px; }
      .connector { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <rect x="32" y="26" width="8" height="34" rx="4" fill="#2563eb"/>
  <text x="58" y="51" class="stage">构建阶段</text>
  <text x="176" y="51" class="stage-note">工程文件由 Zephyr 构建系统组合成固件</text>

  <g filter="url(#shadow)">
    <rect x="40" y="82" width="360" height="54" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="40" y="82" width="6" height="54" rx="3" fill="#3b82f6"/>
    <rect x="62" y="96" width="48" height="26" rx="13" fill="#dbeafe"/>
    <text x="86" y="114" text-anchor="middle" class="badge" fill="#1d4ed8">APP</text>
    <text x="128" y="106" class="card-title">应用代码与配置</text>
    <text x="128" y="126" class="card-note">main.c · prj.conf</text>

    <rect x="40" y="148" width="360" height="54" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="40" y="148" width="6" height="54" rx="3" fill="#22c55e"/>
    <rect x="62" y="162" width="48" height="26" rx="13" fill="#dcfce7"/>
    <text x="86" y="180" text-anchor="middle" class="badge" fill="#15803d">DTS</text>
    <text x="128" y="172" class="card-title">设备树节点</text>
    <text x="128" y="192" class="card-note">控制器 · 引脚 · 参数</text>

    <rect x="40" y="214" width="360" height="54" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="40" y="214" width="6" height="54" rx="3" fill="#f59e0b"/>
    <rect x="62" y="228" width="48" height="26" rx="13" fill="#fef3c7"/>
    <text x="86" y="246" text-anchor="middle" class="badge" fill="#b45309">DRV</text>
    <text x="128" y="238" class="card-title">驱动源码</text>
    <text x="128" y="258" class="card-note">设备的具体操作</text>

    <rect x="40" y="280" width="360" height="54" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="40" y="280" width="6" height="54" rx="3" fill="#8b5cf6"/>
    <rect x="62" y="294" width="48" height="26" rx="13" fill="#ede9fe"/>
    <text x="86" y="312" text-anchor="middle" class="badge" fill="#6d28d9">YAML</text>
    <text x="128" y="304" class="card-title">Binding</text>
    <text x="128" y="324" class="card-note">设备树节点的属性规则</text>
  </g>

  <path class="connector" d="M400 109 C475 109 490 170 548 190"/>
  <path class="connector" d="M400 175 C480 175 505 184 548 190"/>
  <path class="connector" d="M400 241 C480 241 505 198 548 190"/>
  <path class="connector" d="M400 307 C475 307 490 210 548 190"/>

  <circle r="4.5" fill="#60a5fa"><animateMotion path="M400 109 C475 109 490 170 548 190" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#4ade80"><animateMotion path="M400 175 C480 175 505 184 548 190" dur="1.45s" begin="0.15s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#fbbf24"><animateMotion path="M400 241 C480 241 505 198 548 190" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#a78bfa"><animateMotion path="M400 307 C475 307 490 210 548 190" dur="1.7s" begin="0.45s" repeatCount="indefinite"/></circle>

  <circle cx="560" cy="190" r="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="560" y="163" text-anchor="middle" class="flow-label">汇入构建</text>
  <path class="arrow" d="M572 190 H636" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M572 190 H636" dur="0.9s" repeatCount="indefinite"/></circle>

  <g filter="url(#shadow)">
    <rect x="648" y="138" width="210" height="104" rx="16" fill="url(#build-gradient)"/>
    <text x="753" y="184" text-anchor="middle" class="build-title">Zephyr 构建系统</text>
    <text x="753" y="214" text-anchor="middle" class="build-note">选择并组合工程文件</text>
  </g>

  <path class="arrow" d="M858 190 H948" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="903" y="174" text-anchor="middle" class="flow-label">生成</text>
  <circle r="5.5" fill="#86efac"><animateMotion path="M858 190 H948" dur="1s" repeatCount="indefinite"/></circle>

  <g filter="url(#shadow)">
    <rect x="960" y="150" width="200" height="80" rx="14" fill="#f0fdf4" stroke="#4f9d69" stroke-width="2"/>
    <text x="1060" y="184" text-anchor="middle" class="card-title">固件</text>
    <text x="1060" y="208" text-anchor="middle" class="card-note">zephyr.elf</text>
  </g>

  <line x1="32" y1="365" x2="1168" y2="365" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="32" y="391" width="8" height="34" rx="4" fill="#16a34a"/>
  <text x="58" y="416" class="stage">运行阶段</text>
  <text x="176" y="416" class="stage-note">应用通过统一接口调用驱动，驱动再操作硬件</text>

  <g filter="url(#shadow)">
    <rect x="40" y="462" width="210" height="100" rx="15" fill="#ffffff" stroke="#93b4e8" stroke-width="2"/>
    <rect x="40" y="462" width="210" height="7" rx="3" fill="#3b82f6"/>
    <text x="145" y="507" text-anchor="middle" class="card-title">应用</text>
    <text x="145" y="535" text-anchor="middle" class="card-note">处理程序功能</text>

    <rect x="330" y="474" width="190" height="76" rx="38" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="425" y="505" text-anchor="middle" class="card-title">驱动 API</text>
    <text x="425" y="530" text-anchor="middle" class="card-note">统一调用接口</text>

    <rect x="610" y="450" width="250" height="124" rx="15" fill="#ffffff" stroke="#e7aa3b" stroke-width="2"/>
    <rect x="610" y="450" width="250" height="7" rx="3" fill="#f59e0b"/>
    <text x="735" y="497" text-anchor="middle" class="card-title">设备驱动</text>
    <text x="735" y="525" text-anchor="middle" class="card-note">使用设备配置</text>
    <text x="735" y="549" text-anchor="middle" class="card-note">按照硬件要求操作设备</text>

    <rect x="950" y="462" width="210" height="100" rx="15" fill="#ffffff" stroke="#62a675" stroke-width="2"/>
    <rect x="950" y="462" width="210" height="7" rx="3" fill="#22c55e"/>
    <text x="1055" y="507" text-anchor="middle" class="card-title">硬件设备</text>
    <text x="1055" y="535" text-anchor="middle" class="card-note">板载或外接设备</text>
  </g>

  <path class="arrow" d="M250 512 H318" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="284" y="494" text-anchor="middle" class="flow-label">调用</text>
  <circle r="5" fill="#93c5fd"><animateMotion path="M250 512 H318" dur="0.95s" repeatCount="indefinite"/></circle>

  <path class="arrow" d="M520 512 H598" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="559" y="494" text-anchor="middle" class="flow-label">进入驱动</text>
  <circle r="5" fill="#93c5fd"><animateMotion path="M520 512 H598" dur="1s" repeatCount="indefinite"/></circle>

  <path class="arrow" d="M860 512 H938" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="899" y="494" text-anchor="middle" class="flow-label">操作硬件</text>
  <circle r="5" fill="#86efac"><animateMotion path="M860 512 H938" dur="1s" repeatCount="indefinite"/></circle>

  <rect x="280" y="614" width="640" height="38" rx="19" fill="#f8fafc" stroke="#dbe4f0"/>
  <circle cx="306" cy="633" r="5" fill="#22c55e"/>
  <text x="325" y="639" class="stage-note">设备树在构建时生成设备配置，驱动在运行时使用该配置</text>
</svg>
