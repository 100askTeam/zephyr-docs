<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">example-application 与 HPM6E70 工程的目录对应关系</title>
  <desc id="desc">左侧列出 example-application 的应用、板卡、驱动、设备树和接口目录，箭头指向右侧 HPM6E70 工程的对应目录；下方列出 HPM6E70 额外需要的 Zephyr、sdk_glue 和 sdk_env。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "Microsoft YaHei", sans-serif; fill: #172033; }
      .head { font: 700 24px Arial, "Microsoft YaHei", sans-serif; fill: #172033; }
      .path { font: 700 20px Consolas, "Microsoft YaHei", monospace; fill: #172033; }
      .body { font: 17px Arial, "Microsoft YaHei", sans-serif; fill: #475467; }
      .extra { font: 700 20px Arial, "Microsoft YaHei", sans-serif; fill: #172033; }
      .box { stroke-width: 2; rx: 10; }
      .arrow-line { fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">从官方参考工程到 HPM6E70 工程</text>

  <rect x="55" y="78" width="420" height="500" rx="18" fill="#f6f8fc" stroke="#cfd6e4" stroke-width="2"/>
  <text x="265" y="120" text-anchor="middle" class="head">example-application</text>

  <rect x="90" y="150" width="350" height="62" class="box" fill="#e8f1ff" stroke="#4b83d1"/>
  <text x="265" y="180" text-anchor="middle" class="path">app/</text>
  <text x="265" y="201" text-anchor="middle" class="body">一个 Zephyr 应用</text>

  <rect x="90" y="228" width="350" height="62" class="box" fill="#e9f8ef" stroke="#3c9a62"/>
  <text x="265" y="258" text-anchor="middle" class="path">boards/</text>
  <text x="265" y="279" text-anchor="middle" class="body">自定义板卡</text>

  <rect x="90" y="306" width="350" height="62" class="box" fill="#fff5df" stroke="#d89b2b"/>
  <text x="265" y="336" text-anchor="middle" class="path">drivers/</text>
  <text x="265" y="357" text-anchor="middle" class="body">自定义驱动</text>

  <rect x="90" y="384" width="350" height="62" class="box" fill="#f4ecff" stroke="#8b5fc0"/>
  <text x="265" y="414" text-anchor="middle" class="path">dts/bindings/</text>
  <text x="265" y="435" text-anchor="middle" class="body">设备树规则</text>

  <rect x="90" y="462" width="350" height="62" class="box" fill="#eef1f5" stroke="#667085"/>
  <text x="265" y="492" text-anchor="middle" class="path">include/</text>
  <text x="265" y="513" text-anchor="middle" class="body">公共接口</text>

  <rect x="725" y="78" width="420" height="500" rx="18" fill="#f7fbf8" stroke="#bfd8c5" stroke-width="2"/>
  <text x="935" y="120" text-anchor="middle" class="head">HPM6E70 工程</text>

  <rect x="760" y="150" width="350" height="62" class="box" fill="#e8f1ff" stroke="#4b83d1"/>
  <text x="935" y="180" text-anchor="middle" class="path">apps/&lt;应用名&gt;/</text>
  <text x="935" y="201" text-anchor="middle" class="body">多个独立应用</text>

  <rect x="760" y="228" width="350" height="62" class="box" fill="#e9f8ef" stroke="#3c9a62"/>
  <text x="935" y="258" text-anchor="middle" class="path">boards/hpmicro/...</text>
  <text x="935" y="279" text-anchor="middle" class="body">课程开发板</text>

  <rect x="760" y="306" width="350" height="62" class="box" fill="#fff5df" stroke="#d89b2b"/>
  <text x="935" y="336" text-anchor="middle" class="path">drivers/</text>
  <text x="935" y="357" text-anchor="middle" class="body">课程驱动</text>

  <rect x="760" y="384" width="350" height="62" class="box" fill="#f4ecff" stroke="#8b5fc0"/>
  <text x="935" y="414" text-anchor="middle" class="path">dts/bindings/</text>
  <text x="935" y="435" text-anchor="middle" class="body">课程设备树规则</text>

  <rect x="760" y="462" width="350" height="62" class="box" fill="#eef1f5" stroke="#667085"/>
  <text x="935" y="492" text-anchor="middle" class="path">include/dshan/</text>
  <text x="935" y="513" text-anchor="middle" class="body">课程公共接口</text>

  <path class="arrow-line" d="M440 181 H748" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M440 181 H748" dur="1.5s" begin="0s" repeatCount="indefinite"/></circle>
  <path class="arrow-line" d="M440 259 H748" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M440 259 H748" dur="1.5s" begin="0.15s" repeatCount="indefinite"/></circle>
  <path class="arrow-line" d="M440 337 H748" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M440 337 H748" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></circle>
  <path class="arrow-line" d="M440 415 H748" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M440 415 H748" dur="1.5s" begin="0.45s" repeatCount="indefinite"/></circle>
  <path class="arrow-line" d="M440 493 H748" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle r="5" fill="#93c5fd"><animateMotion path="M440 493 H748" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="594" y="164" text-anchor="middle" class="body">目录职责保持不变</text>

  <rect x="55" y="610" width="1090" height="78" rx="14" fill="#fff7e8" stroke="#d89b2b" stroke-width="2"/>
  <text x="85" y="642" class="extra">HPM6E70 增加的底层依赖：</text>
  <text x="355" y="642" class="path">zephyr/</text>
  <text x="485" y="642" class="body">内核</text>
  <text x="585" y="642" class="path">sdk_glue/</text>
  <text x="750" y="642" class="body">SoC 适配</text>
  <text x="880" y="642" class="path">sdk_env/</text>
  <text x="1020" y="642" class="body">SDK 与工具链</text>
  <text x="600" y="674" text-anchor="middle" class="body">west.yml 取得依赖，zephyr/module.yml 将课程目录加入 Zephyr 构建</text>
</svg>
