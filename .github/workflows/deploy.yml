name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check build output
        run: |
          echo "PWD=$(pwd)"
          du -sh build
          find build -maxdepth 2 -type f | head -n 20

      - name: Sync build to server via SSH (incremental rsync with fallback)
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
          DEPLOY_PORT: ${{ secrets.PORT }}
          DEPLOY_TARGET: /www/wwwroot/zephyr.100ask.net/
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          SSH_OPTS="-p ${DEPLOY_PORT} -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          if sshpass -e ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" "command -v rsync >/dev/null 2>&1"; then
            echo "Remote rsync available; syncing incrementally..."
            sshpass -e rsync -rlzcO --itemize-changes --stats \
              --no-perms --no-owner --no-group \
              --delete-delay \
              --exclude='.user.ini' \
              --exclude='.htaccess' \
              --exclude='.well-known/' \
              -e "ssh ${SSH_OPTS}" build/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_TARGET}"
          else
            echo "Remote rsync not found; falling back to streaming tar over SSH..."
            tar -czf - -C build . | sshpass -e ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_TARGET}' && tar -xzf - -C '${DEPLOY_TARGET}'"
          fi

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.CI_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          cname: zephyr.100ask.org
