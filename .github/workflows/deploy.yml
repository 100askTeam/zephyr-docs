name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check build output
        run: |
          echo "PWD=$(pwd)"
          ls -lah
          ls -lah build
          find build -maxdepth 2 -type f | head -n 20

      - name: Copy build to server via SSH
        uses: appleboy/scp-action@v1
        # 默认不部署，避免覆盖原来 Docs 的域名。
        # 等确定 zephyr-docs 的目标域名、配好 secrets 后，在仓库
        # Settings -> Secrets and variables -> Actions -> Variables 里
        # 添加一个变量 DEPLOY_ENABLED=true 才会真正部署。
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "build/**"
          target: /www/wwwroot/rockchip.100ask.net/
          strip_components: 1

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        # 同 SSH 部署，默认不运行，避免抢占 wiki.dshanpi.org。
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          cname: wiki.dshanpi.org
